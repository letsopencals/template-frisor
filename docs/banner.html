<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frisor — Social Banner</title>
<!--
  Renders a branded social/preview banner from the iPhone screenshot.
  Save the iPhone-lineup screenshot in THIS folder as `banner-phones.png` first,
  then open this file in a browser and export the .banner element (1600×892).
  All text sits in the top band — it never overlaps the phones.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F1B17; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .banner {
    width: 1600px; height: 892px; position: relative; overflow: hidden;
    background-image: url('banner-phones.png');
    background-size: cover; background-position: center 58%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  /* Top scrim — darkens the mirror/ceiling band for legible text, fades out well above the phones */
  .scrim-top {
    position: absolute; top: 0; left: 0; right: 0; height: 300px;
    background: linear-gradient(180deg, rgba(15,27,23,0.92) 0%, rgba(15,27,23,0.78) 38%, rgba(15,27,23,0.30) 72%, rgba(15,27,23,0) 100%);
  }
  /* Subtle bottom scrim for the corner caption (sits over the wood table, not the phones) */
  .scrim-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
    background: linear-gradient(0deg, rgba(15,27,23,0.78) 0%, rgba(15,27,23,0) 100%);
  }
  .top {
    position: absolute; top: 44px; left: 64px; right: 64px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .brand { max-width: 880px; }
  .wordmark {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-size: 40px; font-weight: 700; letter-spacing: 0.02em; color: #EFE9DA;
    display: inline-flex; align-items: baseline;
  }
  .wordmark .dot { color: #E8B547; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    background: rgba(232,181,71,0.14); border: 1px solid rgba(232,181,71,0.4);
    border-radius: 100px; padding: 6px 15px;
  }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: #E8B547; }
  .pill-text { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: #f0cb78; text-transform: uppercase; }
  .headline {
    font-family: 'Fraunces', Georgia, serif; font-size: 50px; font-weight: 700;
    line-height: 1.06; letter-spacing: -0.01em; color: #EFE9DA; margin-top: 18px; max-width: 760px;
  }
  .headline span { color: #E8B547; font-style: italic; }
  .sub { font-size: 19px; color: rgba(239,233,218,0.75); margin-top: 14px; max-width: 620px; line-height: 1.5; }
  .built {
    display: flex; align-items: center; gap: 11px;
    color: rgba(239,233,218,0.78); font-size: 15px; font-weight: 500; letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .built .o {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(99,102,241,0.32); border: 1px solid rgba(99,102,241,0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #a5b4fc;
  }
  .built b { color: #EFE9DA; font-weight: 600; }
  .caption {
    position: absolute; bottom: 40px; left: 64px;
    font-size: 15px; letter-spacing: 0.04em; color: rgba(239,233,218,0.62); font-weight: 500;
  }
  .caption b { color: #E8B547; font-weight: 600; }
  .badge-free {
    position: absolute; bottom: 38px; right: 64px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #0F1B17; background: #E8B547; border-radius: 100px; padding: 8px 18px;
  }
</style>
</head>
